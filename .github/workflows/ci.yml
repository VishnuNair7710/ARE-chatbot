name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps
      # Everything except tests marked `live` (those need a real LLM key)
      - run: pytest -q
      # Scripted conversations in rule-based mode: fails if any scenario regresses
      - run: python -m eval.run --mode keyword --report eval/reports/ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/ci.json
